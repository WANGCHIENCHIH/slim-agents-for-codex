[agents]
max_threads = 6
max_depth = 2

[agents.orchestrator]
description = "Execution-team coordinator that implements a root-approved approach through the five Slim specialists."
config_file = "agents/orchestrator.toml"

[agents.oracle]
description = "Strategic technical advisor. Use for architecture decisions, complex debugging, code review, simplification, and engineering guidance."
config_file = "agents/oracle.toml"

[agents.librarian]
description = "External documentation and library research. Use for official docs lookup, GitHub examples, and understanding library internals."
config_file = "agents/librarian.toml"

[agents.explorer]
description = "Fast codebase search and pattern matching. Use for finding files, locating code patterns, and answering where-is-X questions."
config_file = "agents/explorer.toml"

[agents.designer]
description = "UI/UX design, review, and implementation. Use for styling, responsive design, component architecture, and visual polish."
config_file = "agents/designer.toml"

[agents.fixer]
description = "Fast implementation specialist. Receives complete context and a bounded task specification, then executes code changes efficiently."
config_file = "agents/fixer.toml"

[agents.council]
description = "Council chair that selects matching installed agents and synthesizes their independent advice into a structured decision report."
config_file = "agents/council.toml"
