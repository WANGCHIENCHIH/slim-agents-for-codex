name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Resolve curated release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing curated release notes: $notes_file" >&2
            exit 1
          fi
          echo "file=${notes_file}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.RELEASE_TAG) throw new Error(`tag ${process.env.RELEASE_TAG} does not match package ${p.version}`)'

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run snapshots

      - name: Build release package
        id: package
        shell: bash
        run: |
          package_file="$(npm pack --silent)"
          echo "file=${package_file}" >> "$GITHUB_OUTPUT"
          sha256sum "$package_file" > "${package_file}.sha256"

      - name: Smoke-test packed agent and Skill installation
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        shell: bash
        run: |
          smoke_root="$(mktemp -d)"
          npm install --prefix "$smoke_root/npm" "./$PACKAGE_FILE"
          cli="$smoke_root/npm/node_modules/slim-agents-for-codex/dist/cli.js"
          recommended_preset="$(node -p 'require("./presets/aliases.json").recommended')"
          node "$cli" list-presets | grep -F -- "recommended -> ${recommended_preset}"
          node "$cli" install --preset "$recommended_preset" \
            --codex-home "$smoke_root/codex" \
            --skills-home "$smoke_root/skills" \
            --yes
          node "$cli" validate --preset "$recommended_preset" \
            --codex-home "$smoke_root/codex" \
            --skills-home "$smoke_root/skills"
          test -f "$smoke_root/skills/slim-council/SKILL.md"
          test -f "$smoke_root/skills/slim-orchestration/SKILL.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.notes.outputs.file }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite its assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$PACKAGE_FILE" "${PACKAGE_FILE}.sha256" \
            --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES" \
            --repo "$GITHUB_REPOSITORY"
